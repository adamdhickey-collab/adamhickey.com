# The checks, run by something other than whoever remembers.
#
# This does NOT deploy. Deployment is pages.yml, which publishes the repository
# root on every push to main; this file only reports. The two are deliberately
# separate workflows so a failing check reads as a failing check rather than as
# a failed deploy.
#
# WHY THIS EXISTS AT ALL. Until #15 nothing here ran on a pull request. The
# contrast failures fixed in #13 -- 27 of them, including the fill sage used as
# text at 4.12:1 -- were found by pointing staging's scripts at this tree by
# hand. Nothing would have caught them, and nothing would have caught them
# coming back.
#
# For its first weeks this file ran two checks, both about the built Tailwind
# stylesheet, and ended with a note saying the other seven could not run here:
# they lived in staging, which is private, so this public repository's token
# could not check them out. #20 copied the scripts into this tree, and this
# file now runs all nine. It is staging's checks.yml with the two Tailwind
# steps this repository already had, and it differs from staging's in one
# script rather than in any step: counts.mjs here does not carry the claim
# about how many of staging's pages the live site holds, because this is the
# live site (README, "What still differs").
#
# WHY THREE JOBS RATHER THAN ONE. All nine used to run as one job's steps, in
# order, and a job's steps are sequential by definition, so the wall clock was
# their SUM: 11m16s on the three runs before this change. Five of the nine
# finish in about a second between them and need nothing installed. The bill is
# entirely the four browser checks, each of which renders all 29 pages, and
# typescale.mjs renders each of them at four widths.
#
# Those four share no state, so the sum was never necessary. They are a matrix
# now and the wall clock is the LONGEST of them instead. Nothing is skipped,
# scoped or sampled: this is the same nine checks over the same 29 pages, and
# the tripwire counts in CLAUDE.md still read against a tree where every page
# was measured. The cost moves from the clock to the runner, which is the trade
# worth making, because the clock is what a person waits on.
#
# fail-fast is off on purpose. The default cancels the surviving legs the
# moment one goes red, which is how you fix a contrast failure, push, and then
# learn about the type failure that was there all along.
#
# ONE COUPLING THIS SPLIT HAD TO BREAK, and it is worth knowing about because
# it was invisible while the steps shared a job. The contrast step installed
# Chromium when the runner image had no browser; the curves and typescale steps
# set PLAYWRIGHT_BROWSERS_PATH in their own fallback branch but never installed
# anything, because the step above them already had. Apart, that is two jobs
# with no browser on any image that ships without one. Each leg below resolves
# AND installs for itself.
#
# WHEN THIS RUNS, AND WHY IT IS AFTER THE MERGE. From #15 to #147 it ran on
# every pull request. It never gated anything -- main has no branch
# protection, so a red run blocked no merge -- but it put the four browser
# legs on the clock of every merge, so #148 took it down to workflow_dispatch.
# That traded one problem for a worse one: nothing checked a merge at all, and
# the wait simply moved onto the machine of whoever ran the scripts locally
# before pushing. Twice in one sitting a merge went out with half the suite
# unrun, which is the failure this arrangement is meant to make impossible.
#
# So it runs on push to main, AFTER the merge, and on demand. Nobody waits on
# it: the merge lands, pages.yml deploys, and this reports within about ten
# minutes on the commit that is already live. That is not a gate and is not
# meant to be one -- with Pages deploying from main there has never been a
# gate here, only the question of whether anyone finds out. A red run now
# opens an issue (see the report job at the foot of this file), because a red
# run in a tab nobody has open is the same as no run.
#
# On a branch, before merging, ask for it:
#
#   gh workflow run checks.yml --ref <branch>
#
# CLAUDE.md's table says when that is worth the wait. The short version: a
# change to a stylesheet more than one page loads. Everything else can ride
# the post-merge run.
#
# pages.yml still runs deployable.mjs on its own, immediately before the
# upload, so the one check that protects the deploy does not depend on this
# file at all.

name: checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # The five that need nothing installed. No npm, no browser, about a second of
  # actual work between them, so they report while the browser legs are still
  # fetching Chromium.
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default depth of one: seo.mjs holds every
      # page's sitemap lastmod to the file's last commit date, and a shallow
      # checkout dates every file at HEAD. The script notices a shallow clone
      # and skips that comparison rather than failing it, so the cost of
      # forgetting this is a check that quietly stops asking. This is the only
      # job that needs the history, which is why the other two do not pay for
      # it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Ahead of every check about the site, because it is not about the site:
      # it asks whether the tree can be tarred into a Pages artifact at all. A
      # pull request that passes every other check and cannot deploy is the
      # worst shape a repository like this can produce -- green marks on a
      # commit whose bytes never left the runner, and a site that looks
      # unchanged because it is. Staging's #111 was that: an image set nobody
      # could see, behind a node_modules symlink to a path on one Mac.
      # pages.yml runs this too, immediately before the upload; here is where
      # it stops being main's problem.
      #
      # It no longer runs ahead of the other jobs, only ahead of this job's
      # own steps. That is deliberate: making the browser legs wait on it would
      # put this job's whole duration back on the clock to guard against a
      # failure pages.yml catches again anyway, seconds before the upload.
      - name: The tree can be tarred
        run: node scripts/deployable.mjs

      # Goes first among the checks proper because it is the only one that
      # needs nothing installed: no browser, no Tailwind, about a second. A
      # stale token name in the specs should not wait behind a Chromium
      # download to be reported.
      #
      # It asks what the browser checks do not. They read the specs as RULES
      # and the rendered pages as evidence. This reads the specs as CLAIMS:
      # every token they name either exists or is declared retired in the
      # script.
      - name: Every token the documentation names exists
        run: node scripts/tokens.mjs

      # Beside it, and for the same reason: the numbers the documentation
      # asserts about the site, recounted from the tree. Also no browser.
      - name: Every counted claim still counts
        run: node scripts/counts.mjs

      # The third static check, and the same kind of question as the other
      # two: something the documentation asserts, recounted from the tree. What
      # it holds is the metadata no reader ever sees -- a canonical URL per
      # page, an Open Graph card per page, a JSON-LD graph per page, and a
      # sitemap listing every page exactly once. It matters more here than in
      # staging, because here the addresses are the ones a crawler acts on.
      #
      # It goes here because none of that renders. A missing canonical does not
      # move a pixel; a sitemap that lists fourteen of fifteen pages looks
      # exactly like a site with fourteen pages. The browser checks measure
      # what a reader can see, and by construction cannot see any of this.
      - name: What the site tells a machine still matches the site
        run: node scripts/seo.mjs

      # The fourth static check, the same shape again: each article carries its
      # argument three times -- the h2s, the list of key ideas under the dek,
      # and the "Key idea 2 of 6" eyebrow over each section -- and two of the
      # three are written from the first by scripts/keys.mjs. A heading
      # reworded without a --write is a list naming a section the page no
      # longer has, which a reader would notice and no browser check would.
      - name: Every key idea is still its heading
        run: node scripts/keys.mjs

      # No page may go back to compiling its CSS in the browser. #14 removed the
      # cdn.tailwindcss.com script from all six case studies; this is one grep
      # rather than a browser, and it costs nothing to keep. It sits with the
      # static checks rather than with the Tailwind build for that reason: it
      # is a grep, and waiting for an npm install to run a grep is the sort of
      # thing this split exists to stop.
      - name: No page compiles Tailwind in the browser
        run: |
          if grep -rl 'cdn\.tailwindcss\.com' --include='*.html' .; then
            echo "::error title=CDN Tailwind is back::A page loads the browser-side compiler. Build the stylesheet instead -- see tailwind.config.js."
            exit 1
          fi
          echo "no page loads the browser-side compiler"

  # The built stylesheet, on its own, because it is the one check that needs
  # Tailwind and none that needs a browser.
  tailwind:
    name: Built Tailwind CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # No package.json in this repository, and the check scripts are the only
      # thing that would want one. Install what they need for the length of the
      # job rather than committing a manifest for two dependencies.
      #
      # Both in ONE command, and that is not a tidiness preference. With no
      # package.json, `npm install --no-save` rebuilds node_modules around the
      # package it was given: a second call removes what the first installed.
      # Two separate steps looked correct in staging, passed review, and made
      # the Tailwind step delete playwright-core out from under the contrast
      # check two steps later -- "added 72 packages, and removed 1 package".
      #
      # The jobs are separate now, so this job could ask for tailwindcss alone
      # and the browser legs for playwright-core alone. They do not, and the
      # invariant is easier to hold than the exception: ONE install call per
      # job, naming BOTH. A second call anywhere in a job is the bug, and
      # keeping the command identical everywhere means nobody has to re-derive
      # that before editing it.
      - name: Install the checks' dependencies
        run: npm install --no-save --no-audit --no-fund playwright-core tailwindcss@3.4.19

      # The six case studies ship a built stylesheet rather than compiling
      # Tailwind in the browser (#14). Built output can fall behind its markup
      # the moment somebody adds a class and does not rebuild -- and the page
      # would NOT look wrong, because the new class would simply do nothing.
      # That is the failure this step exists for, and it is a risk #14 created.
      #
      # The report is class-level on purpose. Both files are one minified line,
      # so a plain diff prints 15KB twice and says nothing; what a reader needs
      # is which selectors moved.
      - name: Built Tailwind CSS is current
        run: |
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > /tmp/tw-input.css
          npx tailwindcss -c tailwind.config.js -i /tmp/tw-input.css -o /tmp/tw-built.css --minify
          if diff -q /tmp/tw-built.css case-study/case-tailwind.css >/dev/null; then
            echo "built stylesheet matches its source"
            exit 0
          fi
          echo "::error title=Built CSS is stale::case-study/case-tailwind.css is not what tailwind.config.js and the markup produce. Rebuild it with the command in the config header and commit the result."
          cat > /tmp/tw-report.mjs <<'REPORT'
          import fs from 'node:fs';
          /* A selector token, honoring Tailwind's escapes. The escape branch
             has to come first, or the negated class eats the backslash and
             truncates .md\:p-10 to .md. */
          const TOKEN = /\.((?:\\.|[^\\\s{},.:>+~[\]()#*="'])+)/g;
          const sel = (f) => new Set([...fs.readFileSync(f, 'utf8').matchAll(TOKEN)]
            .map((m) => m[1].replace(/\\(.)/g, '$1')));
          const fresh = sel('/tmp/tw-built.css');
          const committed = sel('case-study/case-tailwind.css');
          const missing = [...fresh].filter((s) => !committed.has(s)).sort();
          const extra = [...committed].filter((s) => !fresh.has(s)).sort();
          for (const s of missing) console.log('  the markup uses it, the committed file lacks it: .' + s);
          for (const s of extra) console.log('  in the committed file, no longer built: .' + s);
          if (!missing.length && !extra.length)
            console.log('  same selectors, different bytes -- a Tailwind version change, most likely.');
          REPORT
          sed -i 's/^          //' /tmp/tw-report.mjs
          node /tmp/tw-report.mjs
          exit 1

  # The four that render. One leg each, in parallel, because they are the whole
  # bill and they share nothing.
  #
  # resting.mjs and states.mjs ask different questions and neither covers the
  # other: resting.mjs measures every color a reader can SEE without touching
  # anything, states.mjs forces every hover, focus and script-applied state and
  # measures what a reader can REACH. A color can be perfect at rest and fail
  # on hover, and it can fail sitting still, which no amount of state-forcing
  # notices -- the resting color is the one state that is never forced. They
  # shared a step when steps were the only unit; they are the two slowest, so
  # separating them is most of what this change buys.
  #
  # curves.mjs: a border on a curved surface either follows the whole curve or
  # is not there. Rendered rather than grepped, because it takes two rules to
  # make: the radius on the base, the border on the state. Computed style is
  # the only place they are ever in the same room.
  #
  # typescale.mjs: every rendered type size against the fourteen steps. This
  # file used to say the check could not be added because it was red on this
  # tree -- 24 sizes off the scale, 15px and 17px among them in the hundreds.
  # #16 resolved those and #20 carried the rest. It is the longest leg, because
  # it is the only one that renders every page four times.
  #
  # cards.mjs: does a card on a ground have an edge a reader can see? Merged
  # in #247 deliberately OUTSIDE this workflow, because it was red on 19
  # surfaces the day it arrived and a workflow with a known-red leg tells you
  # nothing about the commit that turned it red. Its own header said to wire
  # it in the day it passes. It passes.
  browser:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: resting
            flags: --strict
            label: Contrast at rest
          - check: states
            flags: --strict
            label: Contrast in every reachable state
          - check: curves
            flags: ''
            label: No partial border on a curved surface
          - check: typescale
            flags: ''
            label: Every type size is on the scale
          - check: cards
            flags: ''
            label: Every card on a ground has an edge that reads
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Both packages, one call. See the note in the tailwind job above: the
      # rule is per job, and this job makes exactly one install call.
      - name: Install the checks' dependencies
        run: npm install --no-save --no-audit --no-fund playwright-core tailwindcss@3.4.19

      # The browser is found rather than assumed: states.mjs takes CHROME at
      # its word without stat-ing it, so a hardcoded path the runner image
      # later moves would surface as a launch failure rather than as a missing
      # browser. Prefer whatever the image ships -- that costs nothing -- and
      # fall back to fetching Chromium, so these checks do not quietly depend
      # on a property of the runner nobody here controls.
      #
      # The install in the fallback branch is the part that used to be missing
      # from two of these four. It is in the shared block now, so a leg cannot
      # inherit a browser it never asked for.
      - name: ${{ matrix.label }}
        run: |
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable \
                   /usr/bin/chromium-browser /usr/bin/chromium; do
            if [ -x "$c" ]; then export CHROME="$c"; break; fi
          done
          if [ -n "$CHROME" ]; then
            echo "using the image's browser: $CHROME"
          else
            echo "no browser on this image; fetching Chromium"
            export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers"
            node node_modules/playwright-core/cli.js install chromium
          fi
          node scripts/${{ matrix.check }}.mjs ${{ matrix.flags }}

  # A red run has to arrive somewhere a person looks. Without this the whole
  # post-merge arrangement rests on someone opening the Actions tab, which is
  # exactly the habit that made the pull-request run feel pointless.
  #
  # if: failure() is on the job, and needs: lists all three, so this fires
  # once for the run rather than once per failing leg. It is skipped on a
  # green run and on a cancelled one.
  #
  # The issue names the commit, because by the time it opens that commit is
  # already the live site: this is a "go and look" notice, not a build break.
  report:
    name: Say so when a check fails
    needs: [static, tailwind, browser]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue against the merged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          short=$(echo "$SHA" | cut -c1-7)
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "checks failed on $short, which is live" \
            --body "$(printf '%s\n' \
              "The checks run after the merge, so \`$short\` is already deployed to https://adamhickey.com." \
              "" \
              "The run, with the failing leg named: $RUN" \
              "" \
              "Reproduce locally with the script the leg names, scoped to the page it faults on:" \
              "" \
              '```bash' \
              "export CHROME=\"/Applications/Google Chrome.app/Contents/MacOS/Google Chrome\"" \
              "node scripts/<check>.mjs <page> --strict" \
              '```')"
